services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres-local
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-claimsetu}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/seed_full.sql:/docker-entrypoint-initdb.d/init.sql:ro

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: minio-local
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniopassword}
    volumes:
      - miniodata:/data

  hipml:
    image: node:14
    container_name: hipml-service
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./hipml-typescript/hipml-typescript:/app
    command: npm run dev
    ports:
      - "3001:3000"

volumes:
  pgdata:
  miniodata:
